<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Coffee Bliss</h1>
            <nav class="nav">
                <a href="#menu">Menu</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h2>Your Perfect Coffee, Every Day</h2>
            <p>Discover the finest blends and hand-crafted beverages.</p>
            <a href="#menu" class="btn">Explore Our Menu</a>
        </div>
    </section>

    <!-- Menu Section -->
    <section id="menu" class="menu">
        <div class="container">
            <h2>Our Menu</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <img src="images/latte_macchiato.jpg" alt="Latte">
                    <h3>Latte</h3>
                    <p>$4.50</p>
                </div>
                <div class="menu-item">
                    <img src="images/cappuccino.jpg" alt="Cappuccino">
                    <h3>Cappuccino</h3>
                    <p>$4.00</p>
                </div>
                <div class="menu-item">
                    <img src="images/espresso.jpg" alt="Espresso">
                    <h3>Espresso</h3>
                    <p>$3.00</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Coffee Bliss. All rights reserved.</p>
            <p>Email: <a href="mailto:contact@coffeebliss.com">contact@coffeebliss.com</a></p>
        </div>
    </footer>
</body>
</html>
